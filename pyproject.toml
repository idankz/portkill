[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portkill"
version = "0.1.0"
description = "Zero-config cross-platform CLI & TUI utility to scan and terminate stubborn port listeners"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
portkill = "portkill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
